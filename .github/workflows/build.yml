name: Build Fabric 26.2

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number only, like 0.4 (do not type the v)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Resolve version
        shell: bash
        run: |
          VER="${{ inputs.version }}"
          VER="${VER#v}"
          if [[ -z "$VER" ]]; then
            VER="0.4"
          fi
          echo "MOD_VERSION=$VER" >> "$GITHUB_ENV"
          echo "Building version v$VER"

      - name: Build
        run: gradle build --stacktrace -Pmod_version=${{ env.MOD_VERSION }}

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.MOD_VERSION }}
          name: v${{ env.MOD_VERSION }}
          files: |
            build/libs/dont-punch-my-tacz-v${{ env.MOD_VERSION }}-26.2-fabric.jar
          fail_on_unmatched_files: true
