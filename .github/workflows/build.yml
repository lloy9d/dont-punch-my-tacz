name: Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number only, like 0.1 or 0.2 (do not type the v)"
        required: true
        default: "0.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pick version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VER="${{ github.event.release.tag_name }}"
          else
            VER="${{ inputs.version }}"
          fi
          VER="${VER#v}"
          echo "MOD_VERSION=$VER" >> "$GITHUB_ENV"
          echo "Using version $VER"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace -Pmod_version=${{ env.MOD_VERSION }}

      - name: Put it on the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.MOD_VERSION }}
          name: v${{ env.MOD_VERSION }}
          files: |
            build/libs/dont-punch-my-tacz-v*.jar
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
