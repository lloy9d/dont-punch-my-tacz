name: Build NeoForge 1.21.1

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number only, like 0.5 (do not type the v)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve version
        shell: bash
        run: |
          VER="${{ inputs.version }}"
          VER="${VER#v}"
          if [[ -z "$VER" ]]; then
            VER="0.5"
          fi
          echo "MOD_VERSION=$VER" >> "$GITHUB_ENV"
          echo "Building version v$VER"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace -Pmod_version=${{ env.MOD_VERSION }}

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: dont-punch-my-tacz-v${{ env.MOD_VERSION }}-1.21.1-neo
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish to release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.MOD_VERSION }}
          name: v${{ env.MOD_VERSION }}
          files: build/libs/dont-punch-my-tacz-v${{ env.MOD_VERSION }}-1.21.1-neo.jar
          fail_on_unmatched_files: true