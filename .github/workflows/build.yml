name: Build Fabric 26.x

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number only, like 0.5 (do not type the v)"
        required: false
        default: ""
      minecraft_version:
        description: "Minecraft version to compile against (the jar name stays 26.x)"
        required: false
        default: "26.2"
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"

      - name: Resolve version
        shell: bash
        run: |
          VER="${{ inputs.version }}"
          VER="${VER#v}"
          if [[ -z "$VER" ]]; then
            VER="0.5"
          fi
          MC="${{ inputs.minecraft_version }}"
          if [[ -z "$MC" ]]; then
            MC="26.2"
          fi
          echo "MOD_VERSION=$VER" >> "$GITHUB_ENV"
          echo "MC_VERSION=$MC" >> "$GITHUB_ENV"
          echo "JAR=dont-punch-my-tacz-v${VER}-26.x-fabric.jar" >> "$GITHUB_ENV"
          echo "Building version v$VER against Minecraft $MC"

      - name: Build
        run: gradle build --stacktrace -Pmod_version=${{ env.MOD_VERSION }} -Pminecraft_version=${{ env.MC_VERSION }}

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: dont-punch-my-tacz-v${{ env.MOD_VERSION }}-26.x
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish to release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.MOD_VERSION }}
          name: v${{ env.MOD_VERSION }}
          files: build/libs/${{ env.JAR }}
          fail_on_unmatched_files: true
