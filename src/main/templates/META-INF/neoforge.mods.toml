modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
displayTest="IGNORE_ALL_VERSION"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Don't Punch My TACZ"
logoFile="icon.png"
description='''
Fixes a first-person visual bug where guns glitch in hand. Automatically adds TACZ, LRTactical, Create and Create: Gunsmithing items to Punchy's first-person blacklist. Same as pressing F8, but automatic. Also hides Punchy's first-person hand while carrying an object with Carry On.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.0,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="punchy"
    type="optional"
    versionRange="[0,)"
    ordering="BEFORE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="tacz"
    type="optional"
    versionRange="[0,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="superbwarfare"
    type="optional"
    versionRange="[0,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="carryon"
    type="optional"
    versionRange="[0,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="cgs"
    type="optional"
    versionRange="[0,)"
    ordering="NONE"
    side="CLIENT"