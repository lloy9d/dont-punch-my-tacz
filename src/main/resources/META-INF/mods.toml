modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
clientSideOnly=true

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Don't Punch My TACZ"
logoFile="icon.png"
description='''Punchy keeps drawing a second gun. This tells Punchy to leave TACZ and SuperbWarfare guns (plus a few Create / Power Grid / Simulated toys) alone. Same trick as pressing F8.'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="punchy"
    mandatory=false
    versionRange="[0,)"
    ordering="BEFORE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="tacz"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="superbwarfare"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="CLIENT"